name: GameNative FEXCore 2610 Exynos 2400 and Snapdragon 865 prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - gamenative/fex-2610-soc-tuning
    paths:
      - '.github/workflows/gamenative-fex-2610-soc-prerelease.yml'
      - '.github/scripts/test-package-fexcore-2610-wcp.sh'
      - '.github/scripts/test-build-fexcore-2610-wcp.sh'
      - 'Scripts/GameNative/**'

permissions:
  contents: write

env:
  FEX_SOURCE_SHA: 14c92681f4d62cf84d901460e0358de09c8847a7
  LLVM_MINGW_TAG: '20250920'
  LLVM_MINGW_SHA256: 8dd8c34fc051a50c2fae86015f35057f8aae93fe1e19b34537ef1269a8b4c772
  LLVM_MINGW_ROOT: /opt/llvm-mingw

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [o3-exynos2400, o3-snapdragon865]

    steps:
      - name: Checkout pipeline branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl dos2unix file git jq \
            meson ninja-build perl pkg-config python3 tar unzip wget xz-utils zstd

      - name: Run helper contract tests
        run: |
          bash .github/scripts/test-package-fexcore-2610-wcp.sh
          bash .github/scripts/test-build-fexcore-2610-wcp.sh
          bash -n Scripts/GameNative/package_fexcore_2610_wcp.sh
          bash -n Scripts/GameNative/build_fexcore_2610_wcp.sh

      - name: Install pinned llvm-mingw
        run: |
          archive="$RUNNER_TEMP/llvm-mingw-${LLVM_MINGW_TAG}.tar.xz"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/bylaws/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-ubuntu-22.04-x86_64.tar.xz" \
            -o "$archive"
          echo "${LLVM_MINGW_SHA256}  ${archive}" | sha256sum -c -
          sudo rm -rf "$LLVM_MINGW_ROOT"
          sudo mkdir -p "$LLVM_MINGW_ROOT"
          sudo tar -C "$LLVM_MINGW_ROOT" --strip-components=1 -xJf "$archive"
          echo "$LLVM_MINGW_ROOT/bin" >> "$GITHUB_PATH"
          "$LLVM_MINGW_ROOT/bin/clang" --version

      - name: Stage exact FEX-2610 source
        id: source
        run: |
          source_dir="$RUNNER_TEMP/fex-2610-source"
          git cat-file -e "${FEX_SOURCE_SHA}^{commit}" || git fetch --no-tags origin main
          git worktree add --detach "$source_dir" "$FEX_SOURCE_SHA"
          git -C "$source_dir" submodule sync --recursive
          git -C "$source_dir" submodule update --init --recursive --depth 1
          actual="$(git -C "$source_dir" rev-parse HEAD)"
          test "$actual" = "$FEX_SOURCE_SHA"
          echo "source_dir=$source_dir" >> "$GITHUB_OUTPUT"
          echo "source_sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Build and package candidate
        id: package
        run: |
          case "${{ matrix.variant }}" in
            o3-exynos2400) suffix=1 ;;
            o3-snapdragon865) suffix=2 ;;
            *) exit 2 ;;
          esac
          version_code=$((261020000 + GITHUB_RUN_NUMBER * 10 + suffix))
          output_dir="$RUNNER_TEMP/fex-output"
          mkdir -p "$output_dir"
          bash Scripts/GameNative/build_fexcore_2610_wcp.sh \
            "${{ steps.source.outputs.source_dir }}" \
            "${{ matrix.variant }}" \
            "$output_dir" \
            "$version_code"
          wcp="$(find "$output_dir" -maxdepth 1 -type f -name '*.wcp' -print -quit)"
          test -n "$wcp"
          echo "wcp=$wcp" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Verify WCP
        run: |
          wcp="${{ steps.package.outputs.wcp }}"
          extract="$RUNNER_TEMP/verify-${{ matrix.variant }}"
          mkdir -p "$extract"
          tar -tJf "$wcp"
          tar -xJf "$wcp" -C "$extract"
          case "${{ matrix.variant }}" in
            o3-exynos2400) expected_version=2610-GameNative-O3-Exynos2400 ;;
            o3-snapdragon865) expected_version=2610-GameNative-O3-Snapdragon865 ;;
          esac
          jq -e --arg v "$expected_version" '.type == "FEXCore" and .versionName == $v and (.files | length == 2)' "$extract/profile.json" >/dev/null
          test -s "$extract/system32/libarm64ecfex.dll"
          test -s "$extract/system32/libwow64fex.dll"
          test "$(find "$extract" -type f | wc -l)" -eq 3
          output_dir="${{ steps.package.outputs.output_dir }}"
          base="$(basename "$wcp")"
          (cd "$output_dir" && sha256sum "$base" > "$base.sha256")
          cat "$output_dir/$base.sha256"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: fexcore-${{ matrix.variant }}
          path: |
            ${{ steps.package.outputs.output_dir }}/*.wcp
            ${{ steps.package.outputs.output_dir }}/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download candidates
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release set and generate combined checksums
        run: |
          cd artifacts
          test -f FEXCore-2610-GameNative-O3-Exynos2400.wcp
          test -f FEXCore-2610-GameNative-O3-Snapdragon865.wcp
          test "$(find . -maxdepth 1 -type f -name '*.wcp' | wc -l)" -eq 2
          sha256sum -c FEXCore-2610-GameNative-O3-Exynos2400.wcp.sha256
          sha256sum -c FEXCore-2610-GameNative-O3-Snapdragon865.wcp.sha256
          sha256sum \
            FEXCore-2610-GameNative-O3-Exynos2400.wcp \
            FEXCore-2610-GameNative-O3-Snapdragon865.wcp \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Set prerelease metadata
        run: |
          short="${FEX_SOURCE_SHA:0:7}"
          echo "RELEASE_TAG=fexcore-2610-gamenative-soc-${short}-pre.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=FEXCore 2610 GameNative SoC-tuned test builds (pre.${GITHUB_RUN_NUMBER})" >> "$GITHUB_ENV"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Experimental **FEXCore 2610** GameNative SoC-tuned WCPs from exact upstream FEX-2610 source commit `${{ env.FEX_SOURCE_SHA }}`.
            
            Both builds use Release/O3, -DNDEBUG, disabled tests/assertions/ccache/LTO,
            and pinned llvm-mingw `${{ env.LLVM_MINGW_TAG }}`. Their ARM ISA target remains
            FEX's conservative generic armv8-a+crc baseline. TUNE_CPU=none prevents CMake
            from appending an -mcpu that could silently enable newer instructions.
            
            - `FEXCore-2610-GameNative-O3-Exynos2400.wcp`: schedules for
              Cortex-A720 (-mtune=cortex-a720), the five Exynos 2400 A720 performance
              cores, with Cortex-X4 prime and Cortex-A520 efficiency cores also present.
            - `FEXCore-2610-GameNative-O3-Snapdragon865.wcp`: schedules for
              Cortex-A77 (-mtune=cortex-a77), matching Snapdragon 865 Kryo 585
              performance cores. This intentionally matches the prior general
              MobileTune scheduling configuration; the target-specific profile
              makes that optimization explicit.
            
            These are compile-time scheduling experiments, not new GPU/driver
            optimizations, per-core runtime dispatch, or measured speedups.
            Benchmark each against the baseline on its intended SoC.
            
            The ARM64EC LTO path remains intentionally disabled due to LLVM linker issues;
            no PGO is claimed.
          files: |
            artifacts/FEXCore-2610-GameNative-O3-Exynos2400.wcp
            artifacts/FEXCore-2610-GameNative-O3-Snapdragon865.wcp
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
