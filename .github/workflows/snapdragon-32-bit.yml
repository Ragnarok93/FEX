name: Snapdragon-32-Bit ARM64 build

on:
  push:
    branches:
      - Snapdragon-32-Bit
      - work/sd865-disk-cache-backport
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapdragon-32-bit-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CC: clang
  CXX: clang++
  FEX_PORTABLE: "1"

jobs:
  arm64-build-test:
    name: ARM64 build and core tests (ARMv8.2-A baseline)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build ccache nasm pkg-config gdb \
            python3 python3-xxhash \
            libcapstone-dev libepoxy-dev libvulkan-dev \
            libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxrender-dev \
            libxkbcommon-dev libwayland-dev libdbus-1-dev libudev-dev \
            libunwind-dev libssl-dev libdrm-dev libgl-dev libegl-dev \
            libxshmfence-dev libxxhash-dev zlib1g-dev

      - name: Checkout pinned submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --depth 1

      - name: Configure for Snapdragon 865-compatible ARM64
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage" \
            -DCMAKE_C_FLAGS="-march=armv8.2-a" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a" \
            -DBUILD_FEXCONFIG=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_ASSERTIONS=ON \
            -DENABLE_CCACHE=ON \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Install staged runtime
        run: cmake --build build --target install --parallel 2

      - name: Run API tests
        run: cmake --build build --target api_tests fexcore_apitests --parallel 2

      - name: Run ARM emitter tests
        run: cmake --build build --target emitter_tests --parallel 2

      - name: Run targeted correctness regression tests
        run: |
          ctest --test-dir build --output-on-failure --timeout 302 \
            -R '(crc32_8b|a32_lods|a32_rep_lods|vcvtps2ph_zeroing|pcmp.*)\.asm$'

      - name: Smoke-test disk-cache reuse for 32-bit guest code
        env:
          FEX_DISKCACHE: "1"
          FEX_DISKCACHEMEMORYBUFFERMB: "0"
          CTEST_PARALLEL_LEVEL: "1"
          FEX_DISKCACHEPATH: ${{ runner.temp }}/fex-disk-cache-smoke
        run: |
          rm -rf "$FEX_DISKCACHEPATH"
          mkdir -p "$FEX_DISKCACHEPATH"
          ctest --test-dir build --output-on-failure --timeout 302 \
            -R 'jit_500_m/Test_32Bit_H0F3A/pcmpxstri_32bit_mode\.asm$'
          test -n "$(find "$FEX_DISKCACHEPATH" -type f -name '*.foz' -size +0c -print -quit)"
          if ! ctest --test-dir build --output-on-failure --timeout 302 \
            -R 'jit_500_m/Test_32Bit_H0F3A/pcmpxstri_32bit_mode\.asm$'; then
            echo "Disk-cache reuse failed; rerunning verbosely for diagnostics"
            ctest --test-dir build --output-on-failure --verbose --timeout 302 \
              -R 'jit_500_m/Test_32Bit_H0F3A/pcmpxstri_32bit_mode\.asm$' || true
            cat build/Testing/Temporary/LastTest.log || true
            exit 1
          fi

      - name: Record build metadata
        if: always()
        run: |
          mkdir -p stage
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "commit=$GITHUB_SHA"
            echo "runner_arch=$(uname -m)"
            echo "compiler=$(clang++ --version | head -n 1)"
            echo "target_flags=-march=armv8.2-a"
            echo "thunks_built=false"
            echo "guest_linux_tests_built=false"
          } > stage/BUILD-METADATA.txt

      - name: Upload staged runtime and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snapdragon-32-Bit-${{ github.sha }}
          path: |
            stage/
            build/compile_commands.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
  wcp-package:
    name: Build installable FEXCore WCP for GameNative / Winlator Bionic
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout Snapdragon-32-Bit source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout pinned submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --depth 1

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl xz-utils git build-essential python3 python3-venv python3-pip pkg-config cmake ninja-build ccache zstd dos2unix perl tar unzip wget

      - name: Cache llvm-mingw
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: /opt/llvm-mingw
          key: llvm-mingw-20251104

      - name: Install llvm-mingw
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/20251104/llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -C /opt/llvm-mingw --strip-components=1 -xJf llvm-mingw.tar.xz
          rm llvm-mingw.tar.xz

      - name: Add llvm-mingw to PATH
        run: echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Configure package version
        run: echo "VERSION_NAME=snapdragon-32-bit-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build ARM64EC and AArch64 FEXCore DLLs
        run: bash scripts/build-fexcore-wcp.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build-wcp"

      - name: Package and validate WCP
        env:
          LLVM_STRIP: /opt/llvm-mingw/bin/llvm-strip
        run: |
          bash scripts/package-fexcore-wcp.sh build-wcp/stage-ec build-wcp/stage-wo "$VERSION_NAME" dist
          tar -tf "dist/FEXCore-$VERSION_NAME.wcp"
          tar -xOf "dist/FEXCore-$VERSION_NAME.wcp" profile.json | python3 -m json.tool

      - name: Upload installable WCP
        uses: actions/upload-artifact@v4
        with:
          name: FEXCore-WCP-${{ github.sha }}
          path: dist/FEXCore-*.wcp
          if-no-files-found: error
          retention-days: 14

